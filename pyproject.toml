[project]
name = "gather-agent"
version = "0.1.0"
description = "The convergence agent — combining the best of DeepSeek-TUI, Claude-Code, Codex, ECC, Hermes-Agent, and OpenClaw"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "GatherAgent Contributors"}]

dependencies = [
    "openai>=1.30",
    "anthropic>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "prompt-toolkit>=3.0",
    "textual>=0.60",
    "sqlite-utils>=3.36",
    "tiktoken>=0.7",
    "aiohttp>=3.9",
    "websockets>=12.0",
    "python-dotenv>=1.0",
    "click>=8.1",
    "pathspec>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.6",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
docker = ["docker>=7.0"]
voice = ["elevenlabs>=1.0", "whisper>=1.0"]
vector = ["lancedb>=0.6", "sentence-transformers>=3.0"]
desktop = ["fastapi>=0.111", "uvicorn>=0.30", "pydantic>=2.7"]
all = ["gather-agent[docker,voice,vector]"]

[project.scripts]
gather = "gather.cli.main:main"

[project.entry-points."gather.memory_providers"]
simple = "gather.memory.providers.simple:SimpleMemoryProvider"
vector_db = "gather.memory.providers.vector_db:VectorDBMemoryProvider"

[project.entry-points."gather.model_providers"]
openai_compat = "gather.providers.openai_compat:OpenAICompatProvider"
anthropic_provider = "gather.providers.anthropic:AnthropicProvider"
openrouter = "gather.providers.openrouter:OpenRouterProvider"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n 4 --tb=short"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
